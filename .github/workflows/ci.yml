name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The advisory database changes without any commit here, so the security
  # audit needs a clock as well as a push to trigger it.
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always

# RUSTFLAGS=-Dwarnings is deliberately not set here: it would apply to
# dependency compilation too (fuser, windows, proptest, and their transitive
# trees), so a new stable rustc adding one warning anywhere in that graph
# would red every job with no anymount changes. Every lint gate instead
# passes `-Dwarnings` explicitly to `cargo clippy`, which scopes it to this
# crate. See CLAUDE.md's Code Style section.

jobs:
  # Phase 0: prove the crate builds and its runtime dependencies resolve on all
  # three platforms. This is the gate the whole plan hangs on.
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Linux mounts via the fusermount3 helper, so only the binary is needed —
      # libfuse headers are deliberately not a build dependency.
      - name: Install fuse3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fuse3

      # macOS mounts through the built-in `mount_nfs` client, so nothing
      # platform-specific needs installing here either.
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets -- -Dwarnings
      # `tracing` is off by default, so its call sites are only compiled here.
      - run: cargo clippy --all-targets --features tracing -- -Dwarnings
      # Every backend cfg'd out: the configuration `mount()` must still build
      # and report `FsError::Unsupported` in.
      - run: cargo clippy --all-targets --no-default-features -- -Dwarnings
      # Scoped to this step rather than the workflow `env:` block, for the
      # reason given at the top of this file: a broken intra-doc link should
      # fail, a warning inside a dependency should not.
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # Reports which backends this runner can actually use. Informational: it
      # must not fail the build, since hosted runners cannot approve a macOS
      # kernel extension.
      - name: Backend probe
        run: cargo run --example probe
        continue-on-error: true

  # The Linux runner is the only one that can complete a real mount unattended.
  mount-smoke-test:
    name: mount smoke test / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: Mount memfs and verify contents
        run: |
          set -euo pipefail
          mkdir -p /tmp/anymount-ci
          cargo build --example memfs
          ( sleep 25 ) | cargo run -q --example memfs -- /tmp/anymount-ci &
          sleep 5
          mount | grep -F /tmp/anymount-ci
          test "$(cat /tmp/anymount-ci/hello.txt)" = "Hello from anymount!"
          # Compare a digest taken through the mount against one computed directly.
          got=$(sha256sum /tmp/anymount-ci/numbers.txt | cut -d' ' -f1)
          want=$(seq 1 100 | sha256sum | cut -d' ' -f1)
          test "$got" = "$want"
          test "$(cat /tmp/anymount-ci/subdir/nested.txt)" = "I am nested."
          # Exercises `..`-driven navigation, matching the NFS job's coverage.
          find /tmp/anymount-ci | sort
          # `..` must report the parent's inode, not the directory's own.
          test "$(stat -c %i /tmp/anymount-ci/subdir/..)" = "$(stat -c %i /tmp/anymount-ci)"
          test "$(stat -c %i /tmp/anymount-ci/subdir/..)" != "$(stat -c %i /tmp/anymount-ci/subdir)"
          wait
          ! mount | grep -qF /tmp/anymount-ci

  # macOS is the other runner that can complete a real mount unattended: the
  # NFS backend needs no kext approval, unlike the FUSE fallback.
  nfs-mount-smoke-test:
    name: nfs mount smoke test / macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Mount memfs over NFS and verify contents
        run: |
          set -euo pipefail
          mkdir -p /tmp/anymount-nfs-ci
          cargo build --example memfs
          ( sleep 25 ) | cargo run -q --example memfs -- /tmp/anymount-nfs-ci &
          sleep 5
          mount | grep -F /tmp/anymount-nfs-ci
          test "$(cat /tmp/anymount-nfs-ci/hello.txt)" = "Hello from anymount!"
          # Compare a digest taken through the mount against one computed directly.
          # `shasum -a 256`, not `sha256sum`: the latter is not a default macOS binary.
          got=$(shasum -a 256 /tmp/anymount-nfs-ci/numbers.txt | cut -d' ' -f1)
          want=$(seq 1 100 | shasum -a 256 | cut -d' ' -f1)
          test "$got" = "$want"
          test "$(cat /tmp/anymount-nfs-ci/subdir/nested.txt)" = "I am nested."
          # Exercises `..`-driven navigation and LOOKUP correctness end to end.
          find /tmp/anymount-nfs-ci | sort
          # `..` must report the parent's inode, not the directory's own.
          # `stat -f %i`, not `-c`: BSD stat, not GNU.
          test "$(stat -f %i /tmp/anymount-nfs-ci/subdir/..)" = "$(stat -f %i /tmp/anymount-nfs-ci)"
          test "$(stat -f %i /tmp/anymount-nfs-ci/subdir/..)" != "$(stat -f %i /tmp/anymount-nfs-ci/subdir)"
          wait
          ! mount | grep -qF /tmp/anymount-nfs-ci

  # Windows is the third runner that completes a real mount. cfapi needs no
  # admin step and no reboot, so this is unattended like the other two; without
  # it the Windows backend would only ever be type checked.
  cfapi-mount-smoke-test:
    name: cfapi mount smoke test / windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Fail with an explanation rather than skipping: a silent skip here
      # would leave the Windows backend claiming verification it never got.
      - name: Confirm the Cloud Files platform is available
        run: |
          set -euo pipefail
          cargo run -q --example probe | tee probe.txt
          if grep -q "Cloud Files (cfapi): unavailable" probe.txt; then
            echo "::error::CldApi reports no platform. This runner cannot host a" \
                 "cfapi mount, so the Windows backend cannot be verified here."
            exit 1
          fi

      - name: Mount memfs and verify contents
        run: |
          set -euo pipefail
          # A Windows-shaped absolute path: cfapi registers a sync root, not a
          # POSIX path, and the mountpoint must be an empty directory.
          root="$(pwd -W)/mnt-cfapi-ci"
          mkdir -p "$root"
          cargo build --example memfs
          ( sleep 40 ) | cargo run -q --example memfs -- "$root" &
          sleep 10

          # Enumerating the root is what triggers FETCH_PLACEHOLDERS.
          ls -l "$root"
          test "$(cat "$root/hello.txt")" = "Hello from anymount!"

          # Compare a digest taken through the mount against one computed
          # directly, so a truncated or misaligned TRANSFER_DATA is caught.
          got=$(sha256sum "$root/numbers.txt" | cut -d' ' -f1)
          want=$(seq 1 100 | sha256sum | cut -d' ' -f1)
          test "$got" = "$want"

          # On-demand population of a subdirectory: a second, separate
          # FETCH_PLACEHOLDERS callback against a non-root inode.
          test "$(cat "$root/subdir/nested.txt")" = "I am nested."
          find "$root" | sort

          wait
          # Unmount must unregister the sync root and clear the placeholders
          # it created, leaving the directory as it was found.
          test -d "$root"
          test -z "$(ls -A "$root")"

  cross-check:
    name: cross-compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin
      # `check` needs no linker, so the Windows backend (cfapi) is type
      # checked on every push without waiting for a Windows runner.
      - name: Check Windows backend
        run: cargo check --target x86_64-pc-windows-msvc

      # `--all-targets` so the `cfg`-gated `*_tests.rs` files compile too; a
      # plain `cargo check` skips them, and a renamed item referenced only
      # from a macOS-gated test would go unnoticed here.
      # `nfs-mount-smoke-test` above is what actually runs this code, on a
      # real macos-latest runner.
      - name: Check macOS
        run: cargo check --target aarch64-apple-darwin --all-targets

  msrv:
    name: MSRV (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      # Pins to the exact floor `rust-version` in Cargo.toml declares, so API
      # usage newer than that only shows up here, not on a user's older
      # toolchain. `dtolnay/rust-toolchain@stable` in the other jobs drifts
      # forward over time and would not catch this.
      - run: cargo check --all-targets
      # Also run them: a test-only helper using an API newer than the floor
      # compiles under `check` but is still a floor violation.
      - run: cargo test

  licenses:
    name: licence policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # Separate from the licence job so a new advisory is reported as its own
  # failure rather than reading as a licence problem. `deny.toml` configures
  # this check; without a job it never ran.
  advisories:
    name: security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Catches a packaging problem — a missing file, an unpublishable path
  # dependency — before a release tag rather than after one.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: cargo publish --dry-run

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
