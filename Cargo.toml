[package]
name = "anymount"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
authors = ["James Howard <jrobhoward@gmail.com>"]
description = "Cross-platform read-only userspace filesystems: FUSE on Linux, Cloud Files on Windows"
repository = "https://github.com/jrobhoward/anymount"
homepage = "https://github.com/jrobhoward/anymount"
keywords = ["filesystem", "fuse", "cfapi", "mount", "userspace"]
categories = ["filesystem", "os"]
readme = "README.md"

[features]
default = ["fuse", "cfapi", "nfs"]

# FUSE via `fusermount3` (Linux only — macOS's decided backend is NFS, not
# FUSE; see docs/PLAN.md). No libfuse to link, just the helper binary, so this
# has no extra system requirement and is safe to default-enable everywhere
# `cargo build`/`cargo test` might run. Inert (compiles to nothing) off Linux.
fuse = ["dep:fuser"]
# NFSv3 server via the built-in `mount_nfs` client (macOS only). Hand-rolled
# RPC/XDR over std::net — no new dependency; `libc::arc4random_buf` (already a
# macOS target dependency) supplies the per-mount secret. Inert off macOS.
nfs = []
# Windows Cloud Files (cfapi) backend. Inert off Windows.
cfapi = ["dep:windows"]
# Per-operation tracing spans.
tracing = ["dep:tracing"]

[dependencies]
thiserror = "2"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
proptest = "1"

# Linux: no libfuse. `default-features = false` makes `fuser` mount via the
# `fusermount3` binary, which keeps LGPL libfuse out of the link entirely and
# allows unprivileged mounts.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false, optional = true }
libc = "0.2"

# macOS: the NFS backend needs `libc::arc4random_buf` and `libc::unmount` for
# its file-handle secret and clean teardown; `types.rs`'s
# `current_uid`/`current_gid` (cfg(unix)) also cover macOS.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[lints.clippy]
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
