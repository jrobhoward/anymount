[package]
name = "anymount"
version = "1.0.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
authors = ["James Howard <jrobhoward@gmail.com>"]
description = "Cross-platform read-only userspace filesystems: FUSE on Linux, NFS on macOS, Cloud Files on Windows"
repository = "https://github.com/jrobhoward/anymount"
homepage = "https://github.com/jrobhoward/anymount"
keywords = ["filesystem", "fuse", "nfs", "cfapi", "mount"]
categories = ["filesystem", "os"]
readme = "README.md"
exclude = ["docs/screenshots"]

# docs.rs builds for x86_64-unknown-linux-gnu by default, which would publish
# only the Linux backend's surface for a crate whose point is spanning three
# platforms. Build for one target per backend, with every feature on, and
# enable `doc_cfg` so each item shows the platform it belongs to.
[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["fuse", "cfapi", "nfs", "nfs-local-socket", "nfs-tcp"]

# FUSE via `fusermount3` (Linux only — macOS's decided backend is NFS, not
# FUSE; see docs/PLAN.md). No libfuse to link, just the helper binary, so this
# has no extra system requirement and is safe to default-enable everywhere
# `cargo build`/`cargo test` might run. Inert (compiles to nothing) off Linux.
fuse = ["dep:fuser"]
# NFSv3 server mounted by the OS's own NFS client (macOS only). Hand-rolled
# RPC/XDR over std::net — no new dependency; `libc::arc4random_buf` (already a
# macOS target dependency) supplies the per-mount secret. Inert off macOS.
#
# `nfs` on its own supplies the server but no way to mount it, so at least one
# of the two transports below has to be enabled with it; `backend/mod.rs`
# refuses the combination at compile time on every platform rather than
# building a backend that cannot mount.
nfs = []

# The two transports below trade privacy against how much of the mechanism
# macOS documents. Both on (the default) tries the local socket and falls back;
# `nfs-local-socket` alone fails rather than falling back; `nfs-tcp` alone
# relies on nothing undocumented. README.md has the comparison, and note that
# cargo features unify — only `MountBuilder::nfs_require_local_socket`
# guarantees the fallback is not used.

# The private-but-better option. Mounts over an `AF_UNIX` socket, with the root
# file handle handed to `mount(2)` directly so the MOUNT protocol never runs:
# nothing listens on the network, no credential reaches the mount table, and
# file permissions on the socket decide who may connect. The argument buffer it
# builds has a layout macOS does not document, so it is tried first rather than
# depended on. Nothing is compiled against a private header — the constants are
# transcribed and only `mount(2)`/`unmount(2)` are called — so a macOS that
# changes the encoding costs a failed mount, not a failed build.
nfs-local-socket = ["nfs"]
# The documented-but-weaker option. Runs `mount_nfs` with options its man page
# documents and uses no private or undocumented interface. The export path
# carries a public value that reaches the system mount table and `nfsstat -m`,
# so a mount is reachable by other local accounts. See docs/GAPS.md.
nfs-tcp = ["nfs"]
# Windows Cloud Files (cfapi) backend. Inert off Windows.
cfapi = ["dep:windows"]
# Per-operation tracing spans.
tracing = ["dep:tracing"]

[dependencies]
thiserror = "2"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
# examples/memfs.rs uses this to open the mount in the OS's file manager after
# mounting — a convenience deliberately left to the caller (see README.md's
# "Opening the mount in a file manager"), not something `anymount` itself
# does. Dev-only: nothing in the library depends on it.
opener = "0.8"
proptest = "1"
# Mountpoint-validation tests need a real directory and a real file. Already in
# the graph as a `proptest` dependency, so naming it here adds no new crate.
tempfile = "3"

# Linux: no libfuse. `default-features = false` makes `fuser` mount via the
# `fusermount3` binary, which keeps LGPL libfuse out of the link entirely and
# allows unprivileged mounts.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false, optional = true }

# Every Unix, not only the two that mount: `types.rs`'s
# `current_uid`/`current_gid` and `error.rs`'s `to_errno` are `cfg(unix)`, so
# scoping `libc` to Linux and macOS left the crate failing to build on any
# other Unix — including the NFS wire layer that `backend/mod.rs` compiles on
# `cfg(unix)` precisely so it can be tested off a Mac. macOS additionally uses
# `libc::arc4random_buf` and `libc::unmount` for the NFS backend's file-handle
# secret and teardown.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_CorrelationVector",
    "Win32_System_IO",
    "Win32_Security",
] }

[lints.clippy]
cognitive_complexity = "warn"
unwrap_used = "warn"
expect_used = "warn"
# A builder whose result is dropped configures nothing, and a `Result`-returning
# method on a trait implementors write is a contract that has to say which
# errors it means. Both are gates rather than one-off attributes, so a new
# public item cannot quietly skip them.
must_use_candidate = "warn"
return_self_not_must_use = "warn"
missing_errors_doc = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
